services:
  postgres:
    build: ./docker/postgres
    container_name: gestisoft-gestionale-postgres
    restart: unless-stopped
    # Limiti di risorse: la VPS ospita anche altri siti/programmi oltre a questo stack — un tetto
    # (mai raggiunto in condizioni normali, è 5-15x il consumo osservato in locale) impedisce che un
    # problema qui (query impazzita, leak) affami gli altri servizi sulla stessa macchina, e viceversa.
    mem_limit: 3g
    cpus: 2.0
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestisoft}
      POSTGRES_USER: ${POSTGRES_USER:-gestisoft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - gestisoft_postgres_data:/var/lib/postgresql/data
      - gestisoft_pgbackrest_repo:/var/lib/pgbackrest
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    # archive_mode/archive_command abilitano il WAL archiving continuo per pgBackRest (PITR,
    # vedi docs/backup-restore.md) — forma a lista per evitare problemi di quoting/split dei
    # comandi Compose sulla stringa di archive_command.
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=gestisoft archive-push %p
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gestisoft} -d ${POSTGRES_DB:-gestisoft}"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      dockerfile: backend/src/GestiSoft.Api/Dockerfile
    container_name: gestisoft-gestionale-api
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.5
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # Le strutture gestite sono tutte italiane e le date/ore inserite dall'operatore (es. orario
      # di invio giornaliero) sono sempre intese come ora locale italiana — senza questo, il
      # confronto con DateTime.Now nei job Worker userebbe UTC, con uno scarto di 1-2 ore (CET/CEST).
      TZ: ${TZ:-Europe/Rome}
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-gestisoft};Username=${POSTGRES_USER:-gestisoft};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      Frontend__Origin: ${FRONTEND_ORIGIN:-http://localhost:8081}
      Jwt__Issuer: ${JWT_ISSUER:-GestiSoft.Gestionale}
      Jwt__Audience: ${JWT_AUDIENCE:-GestiSoft.Gestionale.Client}
      Jwt__Secret: ${JWT_SECRET:?set JWT_SECRET (almeno 32 caratteri casuali)}
      Jwt__LifetimeMinutes: ${JWT_LIFETIME_MINUTES:-30}
      # Letti solo al primissimo avvio per creare il Super Admin iniziale (poi la password vive
      # solo come hash in DB, questi valori non vengono più consultati) — vedi IdentitySeeder.
      SuperAdmin__Email: ${SUPERADMIN_EMAIL:-}
      SuperAdmin__Password: ${SUPERADMIN_PASSWORD:-}
      Gestisoft__BaseUrl: ${GESTISOFT_BASE_URL:-}
      AlloggiatiWeb__Endpoint: ${ALLOGGIATIWEB_ENDPOINT:-}
      Osservatorio__BaseUrl: ${OSSERVATORIO_BASE_URL:-}
      PayTourist__BaseUrl: ${PAYTOURIST_BASE_URL:-}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-5080}:8080"

  worker:
    build:
      context: .
      dockerfile: backend/src/GestiSoft.Worker/Dockerfile
    container_name: gestisoft-gestionale-worker
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      postgres:
        condition: service_healthy
      # L'Api applica le migrazioni EF all'avvio prima di iniziare ad ascoltare (vedi Program.cs) —
      # aspettare che sia "healthy" (curl su /health, vedi Dockerfile) evita che il Worker interroghi
      # tabelle/colonne non ancora create durante un deploy con nuove migrazioni.
      api:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # v. commento sul servizio "api" — i job di invio giornaliero confrontano l'orario configurato
      # con DateTime.Now, che senza TZ sarebbe UTC invece che ora locale italiana.
      TZ: ${TZ:-Europe/Rome}
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-gestisoft};Username=${POSTGRES_USER:-gestisoft};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      Gestisoft__BaseUrl: ${GESTISOFT_BASE_URL:-}
      AlloggiatiWeb__Endpoint: ${ALLOGGIATIWEB_ENDPOINT:-}
      Osservatorio__BaseUrl: ${OSSERVATORIO_BASE_URL:-}
      PayTourist__BaseUrl: ${PAYTOURIST_BASE_URL:-}

  worker-schedine:
    build:
      context: .
      dockerfile: backend/src/GestiSoft.WorkerSchedine/Dockerfile
    container_name: gestisoft-gestionale-worker-schedine
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      TZ: ${TZ:-Europe/Rome}
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-gestisoft};Username=${POSTGRES_USER:-gestisoft};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      Gestisoft__BaseUrl: ${GESTISOFT_BASE_URL:-}
      AlloggiatiWeb__Endpoint: ${ALLOGGIATIWEB_ENDPOINT:-}
      Osservatorio__BaseUrl: ${OSSERVATORIO_BASE_URL:-}
      PayTourist__BaseUrl: ${PAYTOURIST_BASE_URL:-}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: gestisoft-gestionale-frontend
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      - api
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-8081}:80"

volumes:
  gestisoft_postgres_data:
  gestisoft_pgbackrest_repo:
