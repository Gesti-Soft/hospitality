[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full-type=time
repo1-retention-full=30
log-path=/var/log/pgbackrest
process-max=2
compress-type=zst

[gestisoft]
pg1-path=/var/lib/postgresql/data
# Deve corrispondere a POSTGRES_USER in .env — questo cluster non ha un ruolo "postgres"
# (l'immagine ufficiale lo crea solo se POSTGRES_USER non è impostato), quindi il default di
# pgBackRest (pg1-user=postgres) fallisce la connessione. Se cambi POSTGRES_USER, aggiorna anche
# questo valore prima di ricreare il container.
pg1-user=gestisoft
